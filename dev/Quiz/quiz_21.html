<html>
  <head>
    <title>강아지 찾기</title>
  </head>
  <body>
    <script>
      function solution(s, e) {
        let answer = 0;
        const MAX = 10000;
        let dis = new Array(MAX + 1).fill(-1);
        let queue = [s];
        dis[s] = 0;

        for (let i = 0; i < queue.length; i++) {
          let current = queue[i];
          if (current === e) return dis[current];

          for (let next of [current + 1, current - 1, current + 5]) {
            if (next >= 0 && next <= MAX && dis[next] === -1) {
              dis[next] = dis[current] + 1;
              queue.push(next);
            }
          }
        }

        return answer;
      }
      console.log(solution(5, 14)); // 3
      console.log(solution(8, 3)); // 5
      console.log(solution(38, 360)); // 66
    </script>
  </body>
</html>
