<html>
  <head>
    <title>효율적인 회의실 배정 방법</title>
  </head>
  <body>
    <script>
      function solution(meeting) {
        let answer = 0;

        meeting.sort((a, b) => {
          if (a[1] === b[1]) return a[0] - b[0];
          else return a[1] - b[1];
        });

        let endTime = 0;
        for (let m of meeting) {
          if (m[0] >= endTime) {
            answer++;
            endTime = m[1];
          }
        }

        return answer;
      }
      //   let arr = [
      //     [1, 4],
      //     [2, 3],
      //     [3, 5],
      //     [4, 6],
      //     [5, 7],
      //   ]; // 3
      let arr = [
        [3, 3],
        [1, 3],
        [2, 3],
      ]; // 2

      console.log(solution(arr));
    </script>
  </body>
</html>
