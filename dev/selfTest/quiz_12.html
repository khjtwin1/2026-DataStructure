<html>
  <head>
    <title>결혼식 피로연 문제</title>
  </head>
  <body>
    <script>
      function solution(times) {
        let answer = 0;
        let timeLine = [];

        for (let t of times) {
          timeLine.push([t[0], "s"]);
          timeLine.push([t[1], "e"]);
        }

        timeLine.sort((a, b) => {
          if (a[0] === b[0]) return a[1].charCodeAt() - b[1].charCodeAt();
          else return a[0] - b[0];
        });

        console.log(timeLine);

        let cnt = 0;
        for (let t of timeLine) {
          if (t[1] === "s") cnt++;
          else cnt--;

          answer = Math.max(cnt, answer);
        }

        return answer;
      }
      let arr = [
        [14, 18],
        [12, 15],
        [15, 20],
        [20, 30],
        [5, 14],
      ];
      console.log(solution(arr));
    </script>
  </body>
</html>
